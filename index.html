---
title: Apps
layout: default
---
<div class="app-listing">

  <h1 class="page-heading">Apps</h1>

  {% for category in site.data.apps %}
    <section class="app-category">
      <h2 class="app-category-title">{{ category.name }}</h2>
      <div class="app-grid">
        {% for app in category.apps %}
          <a class="app-card" href="{{ app.url | prepend: site.baseurl }}">
            <h3>{{ app.title }}</h3>
            <p>{{ app.description }}</p>
          </a>
        {% endfor %}
      </div>
    </section>
  {% endfor %}

</div>
