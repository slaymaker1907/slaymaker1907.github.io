<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Practice Tracker</title>
  <meta name="description" content="Randomize and track musical practice exercises.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14151b" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="./style.css">
  <!-- app.js is an ES module and pulls in its data layer itself; only this one script tag is needed. -->
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Music Practice Tracker</h1>
      <p class="tagline">Pick your book and a range, then shuffle up something to practice.</p>
    </header>

    <!-- Header form. There is no submit control and every action button opts out of
         submitting, so this never navigates; app.js still attaches a submit handler
         and calls preventDefault() to be safe against Enter-to-submit. -->
    <form id="practice-form" class="practice-form" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="instrument">Instrument</label>
          <div class="input-clear-wrap">
            <input type="text" id="instrument" name="instrument"
                   list="instrument-list" autocomplete="off"
                   placeholder="e.g. Violin">
            <button type="button" class="field-clear" id="instrument-clear"
                    aria-label="Clear instrument">&times;</button>
          </div>
          <datalist id="instrument-list"></datalist>
        </div>

        <div class="field">
          <label for="book">Book</label>
          <div class="input-clear-wrap">
            <input type="text" id="book" name="book"
                   list="book-list" autocomplete="off"
                   placeholder="e.g. Suzuki Book 1">
            <button type="button" class="field-clear" id="book-clear"
                    aria-label="Clear book">&times;</button>
          </div>
          <datalist id="book-list"></datalist>
        </div>

        <div class="field">
          <label for="chapter">Chapter</label>
          <div class="input-clear-wrap">
            <input type="text" id="chapter" name="chapter"
                   list="chapter-list" autocomplete="off"
                   placeholder="e.g. Chapter 3">
            <button type="button" class="field-clear" id="chapter-clear"
                    aria-label="Clear chapter">&times;</button>
          </div>
          <datalist id="chapter-list"></datalist>
        </div>
      </div>

      <!-- The numbering select governs how exercise names are spelled. app.js
           retypes #min/#max between number and text to match: the letter schemes
           take letters ("a" to "f"), while numbers and Roman numerals both take
           plain digits (1-5 renders as I-V). -->
      <fieldset class="range-group">
        <legend>Exercise Number Range</legend>
        <div class="range-fields">
          <div class="field">
            <label for="min">Min</label>
            <input type="number" id="min" name="min"
                   min="1" step="1" inputmode="numeric" placeholder="1">
          </div>
          <div class="field">
            <label for="max">Max</label>
            <input type="number" id="max" name="max"
                   min="1" step="1" inputmode="numeric" placeholder="12">
          </div>
          <div class="field">
            <label for="numbering">Numbering</label>
            <select id="numbering" name="numbering">
              <option value="numbers">1, 2, 3</option>
              <option value="letters-upper">A, B, C</option>
              <option value="letters-lower">a, b, c</option>
              <option value="roman">I, II, III</option>
            </select>
          </div>
        </div>
      </fieldset>

      <div class="actions">
        <button type="button" id="randomize-btn" class="btn btn-primary">Randomize</button>
        <button type="button" id="clear-btn" class="btn btn-secondary">Reset Form</button>
        <button type="button" id="delete-btn" class="btn btn-danger">Delete</button>
      </div>
    </form>

    <section class="results" aria-live="polite">
      <div id="progress-counter" class="progress-counter"></div>

      <!-- List editing toolbar. #edit-list-btn reads "Edit List" when off and
           "Exit Edit" while editing (app.js swaps textContent in setEditMode,
           alongside .editing for the active color); the other two buttons are
           hidden by CSS until .list-actions carries .edit-mode. app.js hides the
           whole bar when there is no rendered list. -->
      <div id="list-actions" class="list-actions hidden">
        <button type="button" id="edit-list-btn" class="btn btn-secondary">Edit List</button>
        <button type="button" id="new-exercise-btn" class="btn btn-secondary">New Exercise</button>
        <button type="button" id="undo-btn" class="btn btn-secondary" disabled>Undo</button>
      </div>

      <!-- app.js injects .exercise-row children here at runtime. -->
      <div id="exercise-list" class="exercise-list"></div>
    </section>
  </main>

  <!-- Details modal (native dialog; opened with showModal() by app.js). -->
  <dialog id="details-modal" class="details-modal" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>

    <label class="modal-completed">
      <input type="checkbox" id="modal-check"> Completed
    </label>

    <label for="modal-comment" class="modal-comment-label">Comment</label>
    <textarea id="modal-comment" rows="8"
              placeholder="Notes, tempo, problem spots&hellip;"></textarea>

    <div class="modal-actions">
      <button type="button" id="modal-save" class="btn btn-primary">Save</button>
      <button type="button" id="modal-cancel" class="btn btn-secondary">Cancel</button>
    </div>
  </dialog>
</body>
</html>
